name: Publish Rumpus image

# Builds the upstream rodwilco/rumpus source at the commit pinned in
# UPSTREAM_REF and publishes it to GHCR. Runs on push (UPSTREAM_REF bumps),
# manually, and weekly — the weekly rebuild picks up base-image
# (node:20-alpine) security updates even when the app itself is unchanged.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codyburker/rumpus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Read pinned upstream ref
        id: ref
        run: echo "sha=$(tr -d ' \n' < UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: rodwilco/rumpus
          ref: ${{ steps.ref.outputs.sha }}
          path: src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CodyBurker/unraid-rumpus
            org.opencontainers.image.title=Rumpus
            org.opencontainers.image.description=Self-hosted Jackbox-style party game platform (TV at /host, phones at /play)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
