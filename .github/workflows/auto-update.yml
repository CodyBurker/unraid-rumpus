name: Auto-update from upstream

# Daily check of each packaged app's upstream repo. If upstream has new
# commits, run that app's test suite at the new commit; only if tests pass,
# bump its ref file and dispatch its publish workflow. Jobs run serially
# (max-parallel: 1) so concurrent bump commits can't conflict.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-test-bump:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - app: rumpus
            upstream: rodwilco/rumpus
            ref_file: UPSTREAM_REF
            publish_workflow: publish.yml
            test_cmd: npm install && npm run test:e2e
          - app: gamenight
            upstream: abhijatchaturvedi/gamenight
            ref_file: UPSTREAM_REF_GAMENIGHT
            publish_workflow: publish-gamenight.yml
            test_cmd: npm install && node test-tournament.js
          - app: lan-games
            upstream: kbennett2000/lan-games
            ref_file: UPSTREAM_REF_LANGAMES
            publish_workflow: publish-langames.yml
            test_cmd: cd server && npm ci && npm test && npm run test:integration
          # Upstream has no test suite, so the gate is booting the real
          # container and probing HTTP (app binds 12345, not the EXPOSEd 5000).
          - app: clonenames
            upstream: cazier/clonenames
            ref_file: UPSTREAM_REF_CLONENAMES
            publish_workflow: publish-clonenames.yml
            test_cmd: >-
              docker build -t cn-gate . &&
              docker run -d --name cn-gate -p 12345:12345 cn-gate &&
              sleep 10 &&
              curl -fsS http://localhost:12345/ > /dev/null &&
              docker rm -f cn-gate
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Compare upstream HEAD with pinned ref
        id: check
        run: |
          upstream=$(git ls-remote https://github.com/${{ matrix.upstream }}.git HEAD | cut -f1)
          current=$(tr -d ' \n' < ${{ matrix.ref_file }})
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }}: already up to date at $current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }}: upstream moved $current -> $upstream"
          fi

      - name: Checkout upstream at new commit
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.upstream }}
          ref: ${{ steps.check.outputs.upstream }}
          path: src

      - name: Set up Node 20 (matches image base)
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run upstream tests (gate)
        if: steps.check.outputs.changed == 'true'
        working-directory: src
        run: ${{ matrix.test_cmd }}

      - name: Bump ref file and push
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > ${{ matrix.ref_file }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump ${{ matrix.app }} upstream to ${{ steps.check.outputs.upstream }} (tests passed)"
          git pull --rebase origin main
          git push

      # Pushes made with GITHUB_TOKEN do not fire on:push workflows, so
      # dispatch the publish workflow explicitly.
      - name: Trigger publish workflow
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ${{ matrix.publish_workflow }} --ref main
