name: Auto-update from upstream

# Daily check of rodwilco/rumpus. If upstream has new commits, run its e2e
# test suite at the new commit; only if tests pass, bump UPSTREAM_REF and
# trigger the publish workflow to build and push a fresh image.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-test-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Compare upstream HEAD with pinned ref
        id: check
        run: |
          upstream=$(git ls-remote https://github.com/rodwilco/rumpus.git HEAD | cut -f1)
          current=$(tr -d ' \n' < UPSTREAM_REF)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date at $current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream moved: $current -> $upstream"
          fi

      - name: Checkout upstream at new commit
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: rodwilco/rumpus
          ref: ${{ steps.check.outputs.upstream }}
          path: src

      - name: Set up Node 20 (matches image base)
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run upstream e2e tests (gate)
        if: steps.check.outputs.changed == 'true'
        working-directory: src
        run: |
          npm install
          npm run test:e2e

      - name: Bump UPSTREAM_REF and push
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > UPSTREAM_REF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump upstream to ${{ steps.check.outputs.upstream }} (e2e tests passed)"
          git push

      # Pushes made with GITHUB_TOKEN do not fire on:push workflows, so
      # dispatch the publish workflow explicitly.
      - name: Trigger publish workflow
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
