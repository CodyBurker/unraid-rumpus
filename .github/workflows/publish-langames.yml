name: Publish LAN Games image

# Builds kbennett2000/lan-games at the commit pinned in UPSTREAM_REF_LANGAMES
# using the upstream repo's own multi-stage Dockerfile (which runs the full
# unit + integration test suites during the build, so every published image
# is self-tested), then layers on an entrypoint that auto-generates and
# persists JWT_SECRET when none is supplied (Dockerfile.langames-unraid).
# Weekly cron rebuilds on a fresh base image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - UPSTREAM_REF_LANGAMES
      - Dockerfile.langames-unraid
      - langames-entrypoint.sh
      - .github/workflows/publish-langames.yml
  schedule:
    - cron: '53 6 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codyburker/lan-games

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Read pinned upstream ref
        id: ref
        run: echo "sha=$(tr -d ' \n' < UPSTREAM_REF_LANGAMES)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: kbennett2000/lan-games
          ref: ${{ steps.ref.outputs.sha }}
          path: src

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No buildx container driver here: the wrapper build's FROM must see
      # the base image in the local docker daemon, so both builds use the
      # default docker driver (fine for single-platform).
      - name: Build upstream image (runs upstream test suites)
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          pull: true
          load: true
          tags: langames-base:build

      - name: Build wrapper and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.langames-unraid
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=langames-base:build
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CodyBurker/unraid-rumpus
            org.opencontainers.image.title=LAN Games
            org.opencontainers.image.description=Self-hosted LAN board game platform (Monopoly, Risk, Battleship, Yahtzee, Life, Checkers, Connect Four, Tic-Tac-Toe)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
