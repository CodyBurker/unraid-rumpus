name: Publish GameNight image

# Builds abhijatchaturvedi/gamenight at the commit pinned in
# UPSTREAM_REF_GAMENIGHT using Dockerfile.gamenight (upstream ships none)
# and publishes to GHCR. Weekly cron rebuilds on a fresh base image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - UPSTREAM_REF_GAMENIGHT
      - Dockerfile.gamenight
      - .github/workflows/publish-gamenight.yml
  schedule:
    - cron: '53 6 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codyburker/gamenight

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Read pinned upstream ref
        id: ref
        run: echo "sha=$(tr -d ' \n' < UPSTREAM_REF_GAMENIGHT)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: abhijatchaturvedi/gamenight
          ref: ${{ steps.ref.outputs.sha }}
          path: src

      - name: Inject Dockerfile
        run: cp Dockerfile.gamenight src/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CodyBurker/unraid-rumpus
            org.opencontainers.image.title=GameNight
            org.opencontainers.image.description=Self-hosted multiplayer party games for your LAN (Mongolpuri, UNO, Quiz, Tic Tac Toe, Scribble)
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
